<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work <3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="countdown-timer" class="countdown-timer"></h1>
        <p id="elapsed-time" class="elapsed-time"></p>
        <div class="progress-bar">
            <div id="progress" class="progress"></div>
        </div>
        <div class="containerinput">
            <div class="inputcontainer">
        <input id="time-start" type="time" placeholder="HH:MM">
        <input id="time-end" type="time" placeholder="HH:MM">
        </div>
        <div class="inputcontainer">
        <input id="date-start" type="date" placeholder="MM-DD">
        <input id="date-end" type="date" placeholder="MM-DD">
        </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
